<!--Верхняя панель навигации-->
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Mailer service</h5>
    <nav class="navbar gap-1 navbar-light navbar-expand-lg ms-5">
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailer:mailing_list' %}">Рассылки</a>
        <a class="p-2 btn btn-outline-primary" href="{#% url 'mailer:message_list' %}">Сообщения</a>
        <a class="p-2 btn btn-outline-primary" href="{#% url 'mailer:mailer_list' %}">Получатели</a>
        <a class="p-2 btn btn-outline-primary" href="{#% url 'mailer:mailer_list' %}">Статистика</a>
        {% endif %}
        <ul class="navbar-nav">
            <li class="nav-item">
                <pre class="nav-item">         </pre>
            </li>

            {% if user.is_authenticated %}
            <li class="nav-item">
                <a class="nav-link" href=#">( Профиль </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href=#"> | </a>
            </li>
            <li class="nav-item">
                <form method="post" action="{#% url 'users:logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link"> Выйти : {{ user.email }} )
                    </button>
                </form>
            </li>
            {% else %}
            <li class="nav-item">
                <a class="nav-link" href="{#% url 'users:login' %}">( Вход </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href=#"> | </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{#% url 'users:register' %}"> Регистрация )</a>
            </li>
            {% endif %}

        </ul>
    </nav>
</div>

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Mailer service</h1>
</div>
<!--Верхняя панель навигации - конец-->
