<!-- login.html -->

{% extends 'mailer/base.html' %}

{% block content %}

<div class="container mt-5">
    <h3 align="center">Авторизация</h3>
    <form class="row justify-content-center" method="post" enctype="multipart/form-data">
        <div class="col-6">
            <div class="card">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Войти
                </button>
            </div>
            <br>
            <a href="{% url 'users:password_reset_request' %}">
                <span> Восстановить пароль </span>
            </a>
        </div>
    </form>
</div>

{% endblock %}
